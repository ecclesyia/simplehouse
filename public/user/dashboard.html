<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SimpleHouse - User Dashboard">
  <title>SimpleHouse - Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Notification Dropdown -->
<div class="notif-dropdown" id="notif-dropdown">
  <div class="notif-dropdown__header">
    <span>Notifications</span>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="notif-dropdown__mark" id="notif-mark-read">Mark all read</span>
      <button class="notif-dropdown__close" id="notif-close">×</button>
    </div>
  </div>
  <div class="notif-list" id="notif-list">
    <div class="notif-empty">No notifications yet.</div>
  </div>
</div>
  <!-- Message Slide Panel -->
  <div class="slide-panel-overlay" id="msg-overlay"></div>
  <div class="slide-panel" id="msg-panel">
    <div class="slide-panel__header">
      <span class="slide-panel__title">Messages</span>
      <button class="slide-panel__close" id="msg-close">×</button>
    </div>
    <!-- User sees their thread directly -->
    <div class="chat-thread" id="chat-thread"></div>
    <div class="chat-input-row">
      <textarea class="chat-input" id="chat-input" rows="1" placeholder="Message Admin..."></textarea>
      <button class="chat-send-btn" id="chat-send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M2 21L23 12 2 3v7l15 2-15 2v7z" fill="white"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="page" id="user-dashboard-page">
    <!-- Sidebar -->
    <aside class="sidebar sidebar--user">
      <div class="sidebar-logo">
        <div class="sidebar-logo__icon">
          <svg width="66" height="68" viewBox="0 0 66 68" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M62.9155 47.5062L42.6847 45.0952L40.2737 65.3261L20.0428 62.9151L22.4538 42.6842L2.22296 40.2732L4.63394 20.0424L24.8648 22.4534L27.2758 2.2225L47.5066 4.63348L45.0957 24.8643L65.3265 27.2753" fill="url(#sidebarLogo)" stroke="white" stroke-width="2"/>
            <defs><linearGradient id="sidebarLogo" x1="37.39" y1="3.43" x2="30.16" y2="64.12" gradientUnits="userSpaceOnUse"><stop stop-color="#385493"/><stop offset="1" stop-color="white"/></linearGradient></defs>
          </svg>
        </div>
        <span class="sidebar-logo__text">SimpleHouse</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-btn active" id="nav-dashboard">
          <div class="sidebar-btn__inner">
            <svg class="sidebar-btn__icon" viewBox="0 0 25 25" fill="none"><path d="M12.5 12.5H22.917V2.083H12.5V12.5ZM0 25H10.417V14.583H0V25ZM0 12.5H10.417V2.083H0V12.5ZM12.5 25H22.917V14.583H12.5V25Z" fill="white"/></svg>
            <span class="sidebar-btn__text">Dashboard</span>
          </div>
        </a>
        <a href="make-queue.html" class="sidebar-btn" id="nav-make-queue">
          <div class="sidebar-btn__inner">
            <svg class="sidebar-btn__icon" viewBox="0 0 24 24" fill="none"><path d="M4 6H2V20C2 21.1 2.9 22 4 22H18V20H4V6ZM20 2H8C6.9 2 6 2.9 6 4V16C6 17.1 6.9 18 8 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H8V4H20V16ZM13 15H15V11H19V9H15V5H13V9H9V11H13V15Z" fill="white"/></svg>
            <span class="sidebar-btn__text">Make Queue</span>
          </div>
        </a>
        <a href="log.html" class="sidebar-btn" id="nav-log">

    </aside>

          <div class="header-icon__badge"></div>
        </a>
      </div>
      <div class="header-profile">

        </svg>
        <div class="profile-info">
          <span class="profile-info__name" id="profile-name">User</span>
          <span class="profile-info__email" id="profile-email">user@email.com</span>
          <span class="profile-info__phone" id="profile-phone">08XX-XXXX-XXXX</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <p class="welcome-text">Welcome back, <strong id="welcome-name">User</strong>!</p>

      <!-- Queue Card (Empty State) -->
      <div class="queue-card" id="queue-empty" style="display:none;">
        <div class="queue-card__icon">
          <svg viewBox="0 0 244 245" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M161.5 82.25H229.43c4.41 0 6.62 0 8.23-1.02.84-.53 1.55-1.24 2.07-2.07 1.02-1.61 1.02-3.82 1.02-8.23V42.63A40.63 40.63 0 00201.13 3H55.83C30.92 3 18.48 3 10.74 10.74 3 18.48 3 30.92 3 55.83V240.75l39.63-13.21 39.62 13.21 39.63-13.21 39.62 13.21V82.25zM201.13 3a40.63 40.63 0 00-39.63 39.63v39.62" stroke="white" stroke-width="6"/>
            <path d="M3 3h52.83M16.21 55.83H3M3 108.67h39.63" stroke="white" stroke-width="6" stroke-linecap="round" transform="translate(89.46 89.46)"/>
          </svg>
        </div>
        <h2 class="queue-card__title">You have no registered queue</h2>
        <p class="queue-card__subtitle">Add a queue to see your consultation's hour.</p>
      </div>

      <!-- Queue Table (Populated State) -->
      <div class="queue-table-wrapper" id="queue-table" style="display:none;">
        <table class="queue-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>Queue ID</th>
              <th>Disease</th>
              <th>Estimation</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="queue-tbody"></tbody>
        </table>
      </div>

      <!-- Action Buttons -->
      <div class="dashboard-actions">
        <a href="make-queue.html" class="action-card" id="action-make-queue">
          <svg class="action-card__icon" viewBox="0 0 35 35" fill="none"><path d="M5.83 8.75H2.92V29.17c0 1.6 1.31 2.92 2.92 2.92h20.42v-2.92H5.83V8.75zM29.17 2.92H11.67c-1.6 0-2.92 1.31-2.92 2.92v17.5c0 1.6 1.31 2.92 2.92 2.92h17.5c1.6 0 2.92-1.31 2.92-2.92V5.83c0-1.6-1.31-2.92-2.92-2.92zm0 20.42H11.67V5.83h17.5v17.5zm-10.21-1.46h2.92V16.04h5.83v-2.92h-5.83V7.29h-2.92v5.83H13.13v2.92h5.83v5.83z" fill="white"/></svg>
          <span class="action-card__text">Make Queue</span>
        </a>
        <a href="log.html" class="action-card" id="action-view-log">
          <svg class="action-card__icon" viewBox="0 0 20 20" fill="none"><path d="M6.25 10.31c0-.25.1-.49.27-.66.18-.18.41-.27.66-.27h5c.25 0 .49.1.66.27.18.18.27.41.27.66 0 .25-.1.49-.27.66-.18.18-.41.27-.66.27h-5c-.25 0-.49-.1-.66-.27a.94.94 0 01-.27-.66zM5 13.13c-.25 0-.49.1-.66.27-.18.18-.27.41-.27.66 0 .25.1.49.27.66.18.18.41.27.66.27h5c.25 0 .49-.1.66-.27.18-.18.27-.41.27-.66 0-.25-.1-.49-.27-.66a.94.94 0 00-.66-.27H5z" fill="white"/><path d="M16.25 0C18.32 0 20 1.65 20 3.74c0 1.23-.42 2.42-.98 3.52-.55 1.1-1.28 2.2-1.98 3.24l-.01.02c-.71 1.07-1.38 2.07-1.88 3.06-.5.99-.78 1.87-.78 2.67 0 .32.08.64.24.92.16.28.39.52.67.69.28.17.59.26.92.27.32.01.64-.07.93-.22.28-.15.52-.38.69-.65.17-.27.27-.59.29-.91.01-.32-.05-.64-.2-.93a1.88 1.88 0 00-.63-.72 1.25 1.25 0 01.38-2.17c.24-.08.5-.07.73.05.67.39 1.18 1.04 1.45 1.81.27.76.29 1.59.06 2.36a3.75 3.75 0 01-1.35 1.92 3.73 3.73 0 01-2.23.74H3.75A3.75 3.75 0 010 16.25c0-1.98 1.11-3.92 2.22-5.63.26-.4.52-.8.78-1.19.59-.89 1.15-1.73 1.61-2.56H3.14c-.72 0-1.73-.17-2.38-.98A3.73 3.73 0 010 3.74 3.75 3.75 0 013.75 0h12.5z" fill="white"/></svg>
          <span class="action-card__text">View Log</span>
        </a>
      </div>
    </main>
  </div>

  <script src="../js/script.js"></script>
  <script>
    // Check user session
    const user = getCurrentUser();
    if (!user || user.role !== 'user') { navigateTo('login.html'); }
    else {
      document.getElementById('welcome-name').textContent = user.fullname || 'User';
      document.getElementById('profile-name').textContent = user.fullname || 'User';
      document.getElementById('profile-email').textContent = user.email || '';
      document.getElementById('profile-phone').textContent = user.phone || '';
    }

    // Seed sample queue data for demo (only if none exist)
    if (!localStorage.getItem('simplehouse_queues')) {
      const sampleQueues = [
        { id: '0001', disease: 'Flu', estimation: '10 Min.', status: 'WAITING' },
        { id: '0002', disease: 'Diabetes', estimation: '15 Min.', status: 'WAITING' },
        { id: '0003', disease: 'Headache', estimation: '5 Min.', status: 'WAITING' }
      ];
      localStorage.setItem('simplehouse_queues', JSON.stringify(sampleQueues));
    }

    // Render queue state
    function renderQueue() {
      const queues = JSON.parse(localStorage.getItem('simplehouse_queues') || '[]');
      const emptyEl = document.getElementById('queue-empty');
      const tableEl = document.getElementById('queue-table');
      const tbody = document.getElementById('queue-tbody');

      if (queues.length === 0) {
        emptyEl.style.display = 'flex';
        tableEl.style.display = 'none';
      } else {
        emptyEl.style.display = 'none';
        tableEl.style.display = 'block';
        tbody.innerHTML = '';
        queues.forEach(function(q, i) {
          const statusClass = q.status === 'WAITING' ? 'status-badge--waiting'
            : q.status === 'DONE' ? 'status-badge--done' : 'status-badge--cancelled';
          const row = document.createElement('tr');
          row.innerHTML =
            '<td>' + (i + 1) + '.</td>' +
            '<td>' + q.id + '</td>' +
            '<td>' + q.disease + '</td>' +
            '<td>' + q.estimation + '</td>' +
            '<td><span class="status-badge ' + statusClass + '">' + q.status + '</span></td>';
          tbody.appendChild(row);
        });
      }
    }
    renderQueue();
  </script>
</body>
</html>
