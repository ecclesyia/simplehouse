  <script>
    // Check admin session
    const user = getCurrentUser();
    if (!user || user.role !== 'admin') { 
      navigateTo('login.html'); 
    } else {
      document.getElementById('welcome-name').textContent = user.fullname || 'Admin';
      document.getElementById('profile-name').textContent = user.fullname || 'Admin';
      document.getElementById('profile-email').textContent = user.email || 'admin@email.com';
      document.getElementById('profile-phone').textContent = user.phone || '08XX-XXXX-XXXX';
    }

    // Set queue count for today (mock logic)
    const queues = JSON.parse(localStorage.getItem('simplehouse_queues') || '[]');
    document.getElementById('queue-count').textContent = queues.length > 0 ? queues.length : '0';
