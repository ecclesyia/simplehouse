<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SimpleHouse - Create your admin account">
  <title>SimpleHouse - Admin Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Notification Dropdown (admin has none, but keep structure) -->
  <div class="notif-dropdown" id="notif-dropdown" style="display:none;"></div>

  <!-- Message Slide Panel (admin sees conversation list) -->
  <div class="slide-panel-overlay" id="msg-overlay"></div>
  <div class="slide-panel slide-panel--admin" id="msg-panel">
    <div class="slide-panel__header">
      <button class="chat-back-btn" id="conv-back" style="display:none;">←</button>
      <span class="slide-panel__title" id="panel-title">Messages</span>
      <button class="slide-panel__close" id="msg-close">×</button>
    </div>
    <!-- Admin sees conversation list first -->
    <div class="conv-list" id="conv-list"></div>
    <!-- Then thread when a conv is clicked -->
    <div class="chat-thread" id="chat-thread" style="display:none;"></div>
    <div class="chat-input-row" id="chat-input-row" style="display:none;">
      <textarea class="chat-input" id="chat-input" rows="1" placeholder="Reply..."></textarea>
      <button class="chat-send-btn" id="chat-send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M2 21L23 12 2 3v7l15 2-15 2v7z" fill="white"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="auth-page" id="admin-register-page">
    <div class="auth-card auth-card--admin">
      <div class="auth-card__inner">
        <!-- Left: Gradient + Logo -->
        <div class="auth-card__left auth-card__left--admin">
          <div class="auth-logo-wrapper">
            <div class="auth-logo">
              <svg width="269" height="269" viewBox="0 0 269 269" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M258.557 192.913L172.371 182.642L162.1 268.828L75.9146 258.557L86.1856 172.371L7.42699e-06 162.1L10.271 75.9146L96.4566 86.1856L106.728 -3.71349e-06L192.913 10.271L182.642 96.4566L268.828 106.728" fill="url(#paint0_reg_admin)"/>
                <defs>
                  <linearGradient id="paint0_reg_admin" x1="149.82" y1="5.13551" x2="119.007" y2="263.692" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#C93434"/>
                    <stop offset="1" stop-color="#995454"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>
        </div>

        <!-- Right: White Form Panel -->
        <div class="auth-card__right">
          <div class="auth-form">
            <h1 class="auth-header auth-header--admin">Create your account</h1>

            <form id="admin-register-form" novalidate>
              <div class="form-group">
                <label class="form-label form-label--admin" for="fullname">Full Name</label>
                <input class="form-input form-input--admin" type="text" id="fullname" name="fullname" placeholder="Enter full name" required>
                <span class="error-text" style="display:none;">Full name is required</span>
              </div>

              <div class="form-group">
                <label class="form-label form-label--admin" for="email">Email</label>
                <input class="form-input form-input--admin" type="email" id="email" name="email" placeholder="Enter email" required>
                <span class="error-text" style="display:none;">Email is required</span>
              </div>

              <div class="form-group">
                <label class="form-label form-label--admin" for="password">Password</label>
                <input class="form-input form-input--admin" type="password" id="password" name="password" placeholder="Enter password" required>
                <span class="error-text" style="display:none;">Password is required</span>
              </div>

              <div class="form-group">
                <label class="form-label form-label--admin" for="phone">Phone Number</label>
                <input class="form-input form-input--admin" type="tel" id="phone" name="phone" placeholder="Enter phone number (ex: 08XX-XXXX-XXXX)" required>
                <span class="error-text" style="display:none;">Phone number is required</span>
              </div>

              <div class="checkbox-group">
                <input class="checkbox checkbox--admin" type="checkbox" id="terms" name="terms" required>
                <label for="terms" class="text-h12-light" style="color: #908DA5;">I agree to the terms and conditions</label>
              </div>

              <button type="submit" class="btn btn--primary-admin" id="btn-admin-register">Sign Up</button>
            </form>

            <div class="auth-switch">
              <span>Already have an account? </span><a href="login.html" class="auth-switch__link">Log In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script>
    document.getElementById('admin-register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!validateForm(this)) return;
      const terms = document.getElementById('terms');
      if (!terms.checked) { alert('Please agree to the terms and conditions'); return; }

      const userData = {
        fullname: document.getElementById('fullname').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        role: 'admin'
      };
      setCurrentUser(userData);
      navigateTo('login.html');
    });
  </script>
</body>
</html>
